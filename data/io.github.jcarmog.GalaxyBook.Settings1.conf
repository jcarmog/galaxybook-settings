<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.github.jcarmog.GalaxyBook.Settings1"/>
  </policy>
  <!-- Anyone may read and call; writes are gated by polkit inside the daemon. -->
  <policy context="default">
    <allow send_destination="io.github.jcarmog.GalaxyBook.Settings1"/>
  </policy>
</busconfig>
